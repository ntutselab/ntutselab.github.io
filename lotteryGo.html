<!DOCTYPE html>

  <head>
    <meta charset="utf-8">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a2b45;
        }

        #title {
            font-size: 3rem;
            color: #fafafa;
            text-align: center;
            padding: 20px;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .doors {
            width: 20%;
            display: flex;
            flex-direction: column;
        }

        .door {
            background: #fafafa;
            width: 200px;
            height: 110px;
            overflow: hidden;
            border-radius: 5px;
            margin: 5px auto;
        }

        .boxes {
            /* transform: translateY(0); */
            transition: transform 1s ease-in-out;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
        }

        .buttons {
            width: 20%;
            display: flex;
            flex-direction: column;
        }

        button {
            width: 200px;
            cursor: pointer;
            font-size: 3rem;
            margin: auto;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
        }

        button:hover {
            background-color: grey;
            color: #fafafa;
        }

        #memberList {
            width: 20%;
            display: flex;
            flex-direction: column;
        }

        #memberList div {
            font-size: 1rem;
            color:#fafafa;
            margin-top: 8px;
            text-align: center;
        }

        #backToPage {
            position: fixed;
            left: 0;
            top: 0;
            color: #1a2b45;
            background-color: #fafafa;
            padding: 5px;
            text-align: center;
            border-bottom-right-radius: 5px;
            user-select: none;
        }

        .firework {
            z-index: -1;
            position: absolute;
            top: 1px;
            left: 1px;
            width: calc(100% - 1px);
            height: 95%;
        }

        #OpeningVideo {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            margin: 104px auto;
            width: 100%;
            height: 100%;
        }

        #OpeningVideo div {
            position: relative;
            width: 36%;
            height: 80%;
            margin: auto;
            border-radius: 20px;
            overflow: hidden;
        }

        #OpeningVideo video {
            display: block;
            margin: auto;
            width: 100%;
            overflow: hidden;
        }

        @keyframes fadeInFromNone {
            0% {
                display: none;
                opacity: 0;
            }

            10% {
                display: block;
                opacity: 0;
            }

            100% {
                display: block;
                opacity: 1;
            }
        }

        @keyframes fadeOutFromNone {
            0% {
                display: block;
                opacity: 1;
            }

            90% {
                display: block;
                opacity: 0;
            }

            100% {
                display: none;
                opacity: 0;
            }
        }

        @media screen and (max-height: 900px) {
            #OpeningVideo div {
                height: 80%;
            }
        }

        @media screen and (max-width: 1200px) {
            #OpeningVideo div {
                width: 440px;
                height: 90%;
            }
        }

    </style>
  </head>
  <body>

    <!-- Fireworks animation (existing external dependency, loaded once) -->
    <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.x/dist/index.umd.js"></script>

    <script>
        // Cryptographically secure integer in [0, maxExclusive).
        // Rejection sampling avoids modulo bias.
        function secureRandomInt(maxExclusive) {
            if (!Number.isSafeInteger(maxExclusive) || maxExclusive < 1 || maxExclusive > 0x100000000) {
                throw new RangeError('Invalid random range');
            }

            const range = 0x100000000;
            const limit = range - (range % maxExclusive);
            const buffer = new Uint32Array(1);
            let value;
            do {
                crypto.getRandomValues(buffer);
                value = buffer[0];
            } while (value >= limit);

            return value % maxExclusive;
        }
    </script>

    <script>
        let isDone = true;
        let isPlay = false;
        let isBusy = false;

        function getAllMembers() {
            let arr = []
            const members = document.querySelectorAll('#memberList div');
            for (const member of members) {
                arr.push(member.textContent);
            }
            return arr;
        }

        const firework1 = new Fireworks.default(document.querySelector('#firework1'))
        firework1.updateOptions({
            rocketsPoint: {
                min: 25,
                max: 25
            },
            sound: {
                enabled: true,
                files: [
                    './sounds/explosion0.mp3',
                    './sounds/explosion1.mp3',
                    './sounds/explosion2.mp3'
                ],
                volume: {
                    min: 2,
                    max: 7
                }
            }
        })
        const firework2 = new Fireworks.default(document.querySelector('#firework2'))
        firework2.updateOptions({
            rocketsPoint: {
                min: 75,
                max: 75
            },
            sound: {
                enabled: true,
                files: [
                    './sounds/explosion0.mp3',
                    './sounds/explosion1.mp3',
                    './sounds/explosion2.mp3'
                ],
                volume: {
                    min: 2,
                    max: 7
                }
            }
        })


        const doors = document.querySelectorAll('.door');

        document.querySelector('#spinner').addEventListener('click', clickEvent);

        function init(firstInit = true, groups = 1, duration = 1, items = getAllMembers()) {
            for (const door of doors) {
                if (firstInit) {
                    door.dataset.spinned = '0';
                } else if (door.dataset.spinned === '1') {
                    return;
                }

                const boxes = door.querySelector('.boxes');
                const boxesClone = boxes.cloneNode(false);
                const pool = ['❓'];

                if (!firstInit) {
                    const arr = [];
                    for (let n = 0; n < (groups > 0 ? groups : 1); n++) {
                        arr.push(...items);
                    }
                    pool.push(...shuffle(arr));
                    items.splice(items.findIndex((ele) => ele === pool[pool.length - 1]), 1);

                    boxesClone.addEventListener(
                        'transitionstart',
                        function () {
                            door.dataset.spinned = '1';
                            this.querySelectorAll('.box').forEach((box) => {
                            box.style.filter = 'blur(1px)';
                            });
                        },
                        { once: true }
                    );

                    boxesClone.addEventListener(
                        'transitionend',
                        function () {
                            this.querySelectorAll('.box').forEach((box, index) => {
                            box.style.filter = 'blur(0)';
                            if (index > 0) this.removeChild(box);
                            });
                        },
                        { once: true }
                    );
                }

                for (let i = pool.length - 1; i >= 0; i--) {
                    const box = document.createElement('div');
                    box.classList.add('box');
                    box.style.width = door.clientWidth + 'px';
                    box.style.height = door.clientHeight + 'px';
                    box.textContent = pool[i];
                    boxesClone.appendChild(box);
                }
                boxesClone.style.transitionDuration = `${duration > 0 ? duration : 1}s`;
                boxesClone.style.transform = `translateY(-${door.clientHeight * (pool.length - 1)}px)`;
                door.replaceChild(boxesClone, boxes);
            }
        }

        function clickEvent() {
            if (isBusy || !isDone) return;
            isBusy = true;
            document.querySelector('#spinner').disabled = true;
            playOpeningVideo();
            setTimeout(spin, 3250); // let spin start after video
        }

        async function spin() {
            if (!isDone) return;
            if (isPlay) {
                init();
            }
            isDone = false;
            init(false, 1, 2);

            for (const door of doors) {
                const boxes = door.querySelector('.boxes');
                const duration = parseInt(boxes.style.transitionDuration);
                boxes.style.transform = 'translateY(0)';
                await new Promise((resolve) => setTimeout(resolve, duration * 100));
            }
            // The last door begins about (doors.length - 1) * 200 ms
            // after the first one. Wait for its 2-second transition.
            const lastDuration = parseFloat(doors[doors.length - 1]
                .querySelector('.boxes').style.transitionDuration) * 1000;
            const stagger = lastDuration * 0.1;
            await new Promise((resolve) => setTimeout(resolve, Math.max(0, lastDuration - stagger)));

            isDone = true;
            isPlay = true;
            isBusy = false;
            document.querySelector('#spinner').disabled = false;
        }

        function shuffle([...arr]) {
            let m = arr.length;
            while (m) {
                const i = secureRandomInt(m--);
                [arr[m], arr[i]] = [arr[i], arr[m]];
            }
            return arr;
        }

        function playOpeningVideo() {
            let videoElement = document.querySelector('#OpeningVideo');
            videoElement.style.animation = "fadeInFromNone 0.4s ease-out";
            videoElement.style.display = 'block';
            const video = document.querySelector('#OpeningVideo video');
            video.currentTime = 0;
            video.play();
            setTimeout(()=>{
                const audio = document.querySelector('audio');
                audio.volume = 0.3;
                audio.play();
            }, 700);
            video.addEventListener('ended', () => {
                videoElement.style.animation = "fadeOutFromNone 0.4s ease-out";
                videoElement.style.display = 'none';
                launchFirework();
            }, { once: true });
        }

        function launchFirework() {
            for (let i=1; i<=5; i++) {
                setTimeout(() => {
                    firework1.launch(i)
                }, Math.random() * 4000);
                setTimeout(() => {
                    firework2.launch(5 - i + 1)
                }, Math.random() * 4000);
            }
        }

        init();
    </script>
  </body>
